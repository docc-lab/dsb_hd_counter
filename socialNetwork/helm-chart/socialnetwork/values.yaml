global: 
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetMemoryUtilizationPercentage: '60'
    targetCPUUtilizationPercentage: '60'
  # Stage3: raised from cpu:100m (which throttled every SN service into
  # collapse at 400 rps). global.resources applies to ALL ~30 SN subchart
  # pods (compute + datastores) unless a subchart overrides .resources, so
  # requests is kept at 1 core to bound total reservation (~30 cores); the
  # 3-core limit gives the compute services room to burst.
  resources:
    limits:
      cpu: "3"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 512Mi
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  dockerRegistry: docker.io
  defaultImageVersion: latest
  redis:
    cluster:
      enabled: false
    standalone:
      enabled: true
    replication:
      primary: redis-master
      replica: redis-replicas
      enabled: false
  memcached:
    cluster:
      enabled: false
      port: &memcached-cluster-port 5000
    standalone:
      enabled: true
  mongodb:
    standalone:
      enabled: true
    sharding:
      enabled: false
      svc:
        name: "mongodb-sharded"
        user: "root"
        password: &mongodb-sharded-password "password"
        port: 27017
  nginx:
    # nginx's `resolver` directive. The xenial openresty image resolves this at
    # config-parse time, so on a cluster whose kube-system DNS Service is NOT
    # named 'kube-dns' (e.g. it's named 'coredns'), this hostname has no A record
    # and nginx-thrift / media-frontend die with
    #   [emerg] host not found in resolver "kube-dns.kube-system..." -> CrashLoopBackOff.
    # The hostname below works on standard kubeadm clusters. If yours differs,
    # override with the DNS ClusterIP literal (what `resolver` actually wants):
    #   helm install ... --set global.nginx.resolverName=<DNS_ClusterIP>
    # Find it: kubectl get svc -n kube-system -l k8s-app=kube-dns \
    #            -o jsonpath='{.items[0].spec.clusterIP}'
    # The stage3-eval harness auto-detects and injects this; see SN_DNS_RESOLVER
    # in noisy-neighbors/stage3-eval/lib/testbed-sn.sh.
    resolverName: kube-dns.kube-system.svc.cluster.local
  jaeger:
    localAgentHostPort: jaeger:6831
    queueSize: 1000000
    bufferFlushInterval: 10
    samplerType: probabilistic
    samplerParam: 0.1
    disabled: false
    logSpans: false

mongodb-sharded:
  fullnameOverride: mongodb-sharded
  auth:
    rootPassword: *mongodb-sharded-password
  shards: 3
  shardsvr:
    dataNode:
      replicaCount: 3

mcrouter:
  controller: statefulset
  memcached:
    replicaCount: 3
  mcrouterCommandParams.port: *memcached-cluster-port

redis-cluster:
  usePassword: false
  redis:
    # default readiness / liveness probes are causing issues, rising timeouts/delays might help
    # cluster health check will be handled by post-commit hook
    readinessProbe:
      enabled: false
    livenessProbe:
      enabled: false

redis:
  fullnameOverride: "redis"
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    persistence:
      enabled: false
    replicaCount: 6
