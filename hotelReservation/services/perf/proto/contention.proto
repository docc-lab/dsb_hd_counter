syntax = "proto3";

// Score-side wire contract for Stage 3.
//
// The ScoreEvent message is what a score.Source produces (one per window
// boundary, paired with the Sample that drove it via sample_id). Mitigation
// systems and any other consumer subscribe to ContentionStream and act on
// the score values.
//
// The score interface is decoupled from any specific producer: the
// source_kind field tells a consumer whether the event came from the
// ONNX predictor, a formula-based scorer, or any other implementation
// registered with the score.Publisher.

package gordion.contention;

option go_package = "github.com/docc-lab/dsb_hd_counter/hotelReservation/services/perf/proto";

// ContentionStream lets external mitigation systems (controllers, k8s
// operators, research notebooks, ...) subscribe to the ScoreEvent stream.
service ContentionStream {
  // Subscribe is a server-streaming RPC. The server sends one ScoreEvent
  // per window boundary, applying optional client-side filters from the
  // request. Per-subscriber drop-on-overflow if the client falls behind.
  rpc Subscribe(ScoreSubscribeReq) returns (stream ScoreEvent);
}

message ScoreSubscribeReq {
  // Optional method-name allow-list. Empty = receive events for all
  // methods. Filters are ANDed with the threshold filters below.
  repeated string only_methods = 1;

  // Suppress events where p50_trend_pred < min_p50_trend.
  // Both scores are in [0, 1]; threshold of 0 means no filter.
  float min_p50_trend = 2;

  // Suppress events where tail_trend_label < min_tail_trend.
  float min_tail_trend = 3;
}

// ScoreEvent is the score for one window. All score fields are
// continuous values in [0, 1]; higher = more contention.
//
// Producer is the in-pod Gordion scorer (Algorithm 1) which always
// computes the formula outputs (y50_current, tail_trend_label,
// ext_pct_50, ext_pct_90). When the pod additionally runs the ONNX
// predictor (prediction_on = true), p50_trend_pred carries the model's
// predicted next-window y50; otherwise p50_trend_pred = y50_current so
// consumers always have one primary p50 signal regardless of mode.
message ScoreEvent {
  int64  sample_id        = 1;   // joins to Sample.sample_id from instrumentation
  int64  timestamp_ns     = 2;
  string service          = 3;

  // Primary p50-side signal, [0, 1]. Predicted next-window y50 (ONNX)
  // when prediction_on; the formula's current y50 otherwise.
  float  p50_trend_pred   = 4;

  // Tail-side signal (formula y90), [0, 1].
  float  tail_trend_label = 5;

  // Stable identifier for the producing configuration: the trainer run
  // config id when prediction_on, the gordion config version otherwise.
  // Mitigation consumers can use this to reject stale streams after a
  // model / config change.
  string model_version    = 6;

  // Tag for which producer emitted this event ("gordion" for the
  // in-pod scorer; future comparator sources use their own tags). Lets
  // a mitigation differentiate when multiple sources are wired up to
  // the same Publisher.
  string source_kind      = 7;

  // The formula's CURRENT y50 (always populated). Equal to
  // p50_trend_pred when prediction_on is false.
  float  y50_current      = 8;

  // Extrinsic contention percentages from the intrinsic-curve
  // decomposition: (T~ - D(lambda)) / T~, clamped to [0, 1]. How much
  // of the current p50/p90 shift is attributable to co-located
  // neighbors rather than the service's own load.
  float  ext_pct_50       = 9;
  float  ext_pct_90       = 10;

  // True when p50_trend_pred came from the in-pod ONNX predictor.
  bool   prediction_on    = 11;
}
