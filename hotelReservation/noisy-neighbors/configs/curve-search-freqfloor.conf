#!/bin/bash
# ===========================================================================
# Config: latency-vs-arrival-rate curve for SEARCH — frequency FLOOR raised
#
# Same instrumented, no-contention sweep as curve-search.conf, but with the
# target node's scaling_min_freq raised to 2400 MHz (base clock) for the
# whole sweep. Governor stays schedutil and turbo stays free (effective
# range 2400 - ~2.9 GHz), so this is the MINIMAL deployable intervention:
# the clock can never park at 800 MHz, but everything else is stock.
#
# This is the OPERATING-MODE / MITIGATION curve — "what does the latency-rate
# curve look like if we simply forbid frequency parking?" — motivated by the
# stage-2 finding (exp_20260704_115519) that the victim's median ACTIVE
# window sits at ~801 MHz under realistic wrk2 load. Raising the min-freq
# floor is a real knob stage-3 could actuate.
#
# It is NOT the intrinsic/mechanism curve: turbo still co-varies with load
# inside the 2400-2900 band, so raw us keeps a clock component and kcyc
# normalization is still needed. For the mechanism curve use
# curve-search-freqpinned.conf (min == max == 2400, no variation at all).
#
# The original bounds are restored automatically on exit (even on Ctrl-C /
# failure); see curve_apply_freq_policy in latency-rate-curve.sh.
# Requires passwordless ssh + sudo cpupower on the target node from node-0.
#
# Usage (run from noisy-neighbors/):
#   ./stage1-characterization/latency-rate-curve.sh configs/curve-search-freqfloor.conf
# ===========================================================================

EXPERIMENT_NAME='Search latency-rate curve (instrumented, no contention, freq floor 2400MHz, schedutil+turbo free)'

# ---------------------------------------------------------------------------
# CPU frequency policy for the sweep (restored on exit).
# Floor only: governor untouched (schedutil), max untouched (turbo free).
# ---------------------------------------------------------------------------
FREQ_MIN_MHZ=2400
# FREQ_GOVERNOR=                     # unset: keep schedutil
FREQ_MAX_MHZ=3400                      # unset: keep hw max (turbo ~2.9GHz free)
# FREQ_SSH_HOST='node-3'             # defaults to TARGET_NODE

# ---------------------------------------------------------------------------
# Cluster topology — CHANGE to match your environment
# ---------------------------------------------------------------------------
TARGET_NODE='node-3'
# LOADGEN_TARGET_HOST_OVERRIDE='192.168.146.152'  # if node InternalIP isn't reachable

OBSERVED_SERVICE='search'

# ---------------------------------------------------------------------------
# ghz load generator (direct gRPC)
# ---------------------------------------------------------------------------
LOADGEN_BIN='/usr/local/bin/ghz'
LOADGEN_PROTO='../services/search/proto/search.proto'
LOADGEN_PROTO_ROOT='../services'
LOADGEN_METHOD='search.Search/Nearby'
LOADGEN_PAYLOAD_GENERATOR='./loadgen/payloads/gen_search_nearby.py'
LOADGEN_PAYLOAD_COUNT=5000
LOADGEN_CONCURRENCY=128            # headroom to DELIVER up to ~4500 RPS open-loop
LOADGEN_CONNECTIONS=32             # low conn count caps ghz throughput below the knee
LOADGEN_ASYNC=true                 # open-loop: required to expose the real knee
LOADGEN_NODEPORT=31082             # firewalld-friendly range (30000-32767)

# ---------------------------------------------------------------------------
# Sweep. Same schedule semantics as curve-search.conf (SATURATION_SEGMENTS
# env-overridable). Matching the 36-level run's schedule makes the pinned
# curve directly comparable level-for-level with the schedutil curve.
# ---------------------------------------------------------------------------
SATURATION_SEGMENTS="${SATURATION_SEGMENTS:-100-4500:250}"

# Fallback arithmetic sweep (used only when SATURATION_SEGMENTS is empty/unset).
SATURATION_START_RPS=100
SATURATION_STEP_RPS=250
SATURATION_MAX_RPS=4500
SATURATION_DURATION=30             # measured ghz seconds per level
SATURATION_WARMUP=5                # warmup ghz seconds per level (discarded)
SATURATION_P99_THRESHOLD=4.0       # used only to annotate the 'saturated' column
SATURATION_ERROR_RATE_THRESHOLD=0.01

# Curve-specific knobs (also overridable via env)
SATURATION_COOLDOWN=15             # per-level idle drain (queue clears here)
CURVE_WINDOW_MARGIN=30             # safety seconds added to the computed window
CURVE_FILE_POLL_TIMEOUT=120

# ---------------------------------------------------------------------------
# Windowed / interceptor sampling (ENABLE_WINDOWED_SAMPLING is forced true by
# the script). These tune the in-pod sampler.
# ---------------------------------------------------------------------------
WINDOW_INTERVAL_MS=100
TIMING_BUFFER_SIZE=16384
TIMING_FLUSH_THRESHOLD=80
C0_ACTIVE_THRESHOLD=0.05
MSR_TURBO_REFRESH_EVERY_S=10
# TSC_FREQ_MHZ=                      # leave unset => in-pod auto from /proc/cpuinfo
# Keep per-window frequency sampling ON here: the freq column is how we VERIFY
# the pin held (flat ~2400 at every level). See curve-search.conf for the
# sampler-stall caveat if you need it off.
WINDOWED_FREQ_ENABLED=true

# Perf events captured per window (must include cycles + instructions +
# LLC-load-misses for the curve's IPC / LLC-MPKI columns).
PERF_EVENTS='cycles,ref-cycles,instructions,LLC-loads,LLC-load-misses,branch-instructions,branch-misses,dTLB-loads,dTLB-load-misses,page-faults'

# ---------------------------------------------------------------------------
# Jaeger tracing — disabled to avoid overhead
# ---------------------------------------------------------------------------
JAEGER_SAMPLE_RATIO=0
