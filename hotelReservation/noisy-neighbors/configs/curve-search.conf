#!/bin/bash
# ===========================================================================
# Config: Instrumented latency-vs-arrival-rate curve for SEARCH (no contention)
#
# Drives search.Search/Nearby directly via NodePort with ghz while the
# in-pod interceptor / windowed sampler is ENABLED, so each RPS level yields
# per-window arrival-rate + service-time + perf samples. NO stressor.
#
# Usage (run from noisy-neighbors/): ./stage1-characterization/latency-rate-curve.sh configs/curve-search.conf
# ===========================================================================

EXPERIMENT_NAME='Search latency-rate curve (instrumented, no contention)'

# ---------------------------------------------------------------------------
# Cluster topology — CHANGE to match your environment
# ---------------------------------------------------------------------------
TARGET_NODE='node-3'
# LOADGEN_TARGET_HOST_OVERRIDE='192.168.146.152'  # if node InternalIP isn't reachable

OBSERVED_SERVICE='search'

# ---------------------------------------------------------------------------
# ghz load generator (direct gRPC)
# ---------------------------------------------------------------------------
LOADGEN_BIN='/usr/local/bin/ghz'
LOADGEN_PROTO='../services/search/proto/search.proto'
LOADGEN_PROTO_ROOT='../services'
LOADGEN_METHOD='search.Search/Nearby'
LOADGEN_PAYLOAD_GENERATOR='./loadgen/payloads/gen_search_nearby.py'
LOADGEN_PAYLOAD_COUNT=5000
LOADGEN_CONCURRENCY=128            # headroom to DELIVER up to ~4500 RPS open-loop
LOADGEN_CONNECTIONS=32             # low conn count caps ghz throughput below the knee
LOADGEN_ASYNC=true                 # open-loop: required to expose the real knee
LOADGEN_NODEPORT=31082             # firewalld-friendly range (30000-32767)

# ---------------------------------------------------------------------------
# Sweep. ONE continuous sampler window covers the whole sweep (no per-level
# pod restart). Per level: warmup ghz (SATURATION_WARMUP, discarded) ->
# measured ghz (SATURATION_DURATION) -> idle cooldown (SATURATION_COOLDOWN)
# so the stateless service's transient queue drains before the next level.
# The full sweep always runs (early-stop needs a per-level window close).
# ---------------------------------------------------------------------------
# Piecewise sweep schedule: whitespace-separated "lo-hi:step" tokens. When set,
# this OVERRIDES START/STEP/MAX and lets the step vary across the range --
# coarse far from the knee, progressively finer through it (curvature-based
# sampling). The intrinsic (no-contention) knee of a 3-core search pod is well
# above the 2400 RPS *contention* operating point, so sweep high.
#
# Two-pass workflow (see stage1-characterization/RERUN-PLAN-search-curve.md):
#   1. COARSE locate:   SATURATION_SEGMENTS='100-4500:250'
#   2. PROFILE (center progressive fineness on the measured knee K, e.g. K~3000):
#      SATURATION_SEGMENTS='100-2400:300 2400-2800:100 2800-3200:20 3200-4200:250'
SATURATION_SEGMENTS='100-4500:250'

# Fallback arithmetic sweep (used only when SATURATION_SEGMENTS is empty/unset).
SATURATION_START_RPS=100
SATURATION_STEP_RPS=250
SATURATION_MAX_RPS=4500
SATURATION_DURATION=30             # measured ghz seconds per level
SATURATION_WARMUP=5                # warmup ghz seconds per level (discarded)
SATURATION_P99_THRESHOLD=4.0       # used only to annotate the 'saturated' column
SATURATION_ERROR_RATE_THRESHOLD=0.01

# Curve-specific knobs (also overridable via env)
SATURATION_COOLDOWN=15             # per-level idle drain (queue clears here)
CURVE_WINDOW_MARGIN=30             # safety seconds added to the computed window
CURVE_FILE_POLL_TIMEOUT=120

# ---------------------------------------------------------------------------
# Windowed / interceptor sampling (ENABLE_WINDOWED_SAMPLING is forced true by
# the script). These tune the in-pod sampler.
# ---------------------------------------------------------------------------
WINDOW_INTERVAL_MS=100
TIMING_BUFFER_SIZE=16384
TIMING_FLUSH_THRESHOLD=80
C0_ACTIVE_THRESHOLD=0.05
MSR_TURBO_REFRESH_EVERY_S=10
# TSC_FREQ_MHZ=                      # leave unset => in-pod auto from /proc/cpuinfo

# Perf events captured per window (must include cycles + instructions +
# LLC-load-misses for the curve's IPC / LLC-MPKI columns).
PERF_EVENTS='cycles,ref-cycles,instructions,LLC-loads,LLC-load-misses,branch-instructions,branch-misses,dTLB-loads,dTLB-load-misses,page-faults'

# ---------------------------------------------------------------------------
# Jaeger tracing — disabled to avoid overhead
# ---------------------------------------------------------------------------
JAEGER_SAMPLE_RATIO=0
