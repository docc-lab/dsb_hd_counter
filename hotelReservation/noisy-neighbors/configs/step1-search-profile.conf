#!/bin/bash
# ===========================================================================
# Step 1 Config: Characterize Search & Profile Services
#
# Stateless-forwarding service : search
# Stateful-computing service   : profile
#
# Usage: ./step1-characterize.sh configs/step1-search-profile.conf
# ===========================================================================

EXPERIMENT_NAME='Step1 Search+Profile Characterization'

# ---------------------------------------------------------------------------
# Cluster topology — CHANGE THESE to match your environment
# ---------------------------------------------------------------------------
TARGET_NODE='node-1'                # Node to pin victim services to
WRK2_TARGET_IP='192.168.1.100'     # IP reachable by wrk2 client (node IP or LB)
WRK2_TARGET_PORT=5000              # Frontend service port

# ---------------------------------------------------------------------------
# Services under observation (profiled, not under attack)
# ---------------------------------------------------------------------------
OBSERVED_SERVICES='search profile'

# ---------------------------------------------------------------------------
# wrk2 workload
# ---------------------------------------------------------------------------
WRK2_SCRIPT='../wrk2/scripts/hotel-reservation/mixed-workload_type_1.lua'
WRK2_THREADS=3
WRK2_CONNECTIONS=3

# ---------------------------------------------------------------------------
# Stage 1 — Saturation sweep
#
# Start at 100 RPS, step by 100 until 3000 or saturation.
# Each level runs for 30 s.  Knee declared when p99 >= 2x baseline.
# ---------------------------------------------------------------------------
SATURATION_START_RPS=100
SATURATION_STEP_RPS=100
SATURATION_MAX_RPS=3000
SATURATION_DURATION=30
SATURATION_WARMUP=15
SATURATION_P99_THRESHOLD=2.0

# ---------------------------------------------------------------------------
# Stage 2 — Characterization runs
#
# 5 min runs, 5 total, at 90% of knee-point RPS.
# ---------------------------------------------------------------------------
CHARACTERIZE_DURATION=300   # 5 minutes
CHARACTERIZE_RUNS=5
CHARACTERIZE_KNEE_FRACTION=0.9

# ---------------------------------------------------------------------------
# In-process instrumentation (windowed perf + gRPC timing interceptor)
# ---------------------------------------------------------------------------
ENABLE_WINDOWED_SAMPLING=true
WINDOW_INTERVAL_MS=100
PERF_EVENTS='cycles,instructions,cache-references,cache-misses,branch-instructions,branch-misses,dTLB-load-misses,iTLB-load-misses,page-faults,minor-faults,major-faults,context-switches,cpu-migrations'
TIMING_BUFFER_SIZE=16384

# ---------------------------------------------------------------------------
# Jaeger tracing — disabled to avoid overhead during characterization
# ---------------------------------------------------------------------------
JAEGER_SAMPLE_RATIO=0
