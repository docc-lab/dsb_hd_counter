#!/bin/bash
# ===========================================================================
# Step 1 Config: Characterize Search & Profile Services (Vanilla)
#
# Stateless-forwarding service : search
# Stateful-computing service   : profile
#
# Vanilla deployment — standard images, no interceptor, no in-process
# perf sampling.  Perf counters collected externally via perf stat.
#
# Usage: ./step1-characterize.sh configs/step1-search-profile.conf
# ===========================================================================

EXPERIMENT_NAME='Step1 Search+Profile Characterization'

# ---------------------------------------------------------------------------
# Cluster topology — CHANGE THESE to match your environment
# ---------------------------------------------------------------------------
TARGET_NODE='node-1'                # Node to pin observed services to
WRK2_TARGET_IP='192.168.146.152'     # IP reachable by wrk2 client (node IP or LB)
WRK2_TARGET_PORT=5000              # Frontend service port

# ---------------------------------------------------------------------------
# Services under observation (profiled, not under attack)
# ---------------------------------------------------------------------------
OBSERVED_SERVICES='search profile'

# ---------------------------------------------------------------------------
# wrk2 workload
# ---------------------------------------------------------------------------
WRK2_SCRIPT='../wrk2/scripts/hotel-reservation/mixed-workload_type_1.lua'
WRK2_THREADS=10
WRK2_CONNECTIONS=12

# ---------------------------------------------------------------------------
# Stage 1 — Saturation sweep
#
# Sweep RPS from START to MAX with fixed STEP.  A level is declared
# saturated when p99 >= P99_THRESHOLD x baseline, errors appear, or
# actual RPS falls short of target.  After the first saturated level,
# the sweep continues for EXTRA_LEVELS more levels (same step) to
# verify saturation and collect post-knee data.  Knee = highest RPS
# across all levels that did not saturate.
# ---------------------------------------------------------------------------
SATURATION_START_RPS=50
SATURATION_STEP_RPS=25
SATURATION_MAX_RPS=600
SATURATION_DURATION=20
SATURATION_WARMUP=5
SATURATION_P99_THRESHOLD=4.0
SATURATION_EXTRA_LEVELS=4

# ---------------------------------------------------------------------------
# Stage 2 — Characterization runs
#
# 5 min runs, 5 total, at 90% of knee-point RPS.
# ---------------------------------------------------------------------------
CHARACTERIZE_DURATION=100  
CHARACTERIZE_RUNS=3
CHARACTERIZE_KNEE_FRACTION=0.9

# ---------------------------------------------------------------------------
# External perf stat events (collected via SSH + perf stat on the node)
# ---------------------------------------------------------------------------
PERF_EVENTS='cycles,instructions,LLC-loads,LLC-load-misses,branch-instructions,branch-misses'

# ---------------------------------------------------------------------------
# Jaeger tracing — disabled to avoid overhead during characterization
# ---------------------------------------------------------------------------
JAEGER_SAMPLE_RATIO=0
