#!/bin/bash
# ===========================================================================
# Config: Instrumented latency-vs-arrival-rate curve for PROFILE (no contention)
#
# Drives profile.Profile/GetProfiles directly via NodePort with ghz while the
# in-pod interceptor / windowed sampler is ENABLED. NO stressor.
#
# Usage (run from noisy-neighbors/): ./stage1-characterization/latency-rate-curve.sh configs/curve-profile.conf
# ===========================================================================

EXPERIMENT_NAME='Profile latency-rate curve (instrumented, no contention)'

# ---------------------------------------------------------------------------
# Cluster topology — CHANGE to match your environment
# ---------------------------------------------------------------------------
TARGET_NODE='node-3'
# LOADGEN_TARGET_HOST_OVERRIDE='192.168.146.152'

OBSERVED_SERVICE='profile'

# ---------------------------------------------------------------------------
# ghz load generator (direct gRPC)
# ---------------------------------------------------------------------------
LOADGEN_BIN='/usr/local/bin/ghz'
LOADGEN_PROTO='../services/profile/proto/profile.proto'
LOADGEN_PROTO_ROOT='../services'
LOADGEN_METHOD='profile.Profile/GetProfiles'
LOADGEN_PAYLOAD_GENERATOR='./loadgen/payloads/gen_profile_getprofiles.py'
LOADGEN_PAYLOAD_COUNT=5000
LOADGEN_CONCURRENCY=12
LOADGEN_CONNECTIONS=4
LOADGEN_ASYNC=true
LOADGEN_NODEPORT=31081             # mnemonic: 31081 -> service port 8081

# ---------------------------------------------------------------------------
# Sweep
# ---------------------------------------------------------------------------
SATURATION_START_RPS=50
SATURATION_STEP_RPS=25
SATURATION_MAX_RPS=600
SATURATION_DURATION=30
SATURATION_WARMUP=5
SATURATION_P99_THRESHOLD=4.0
SATURATION_ERROR_RATE_THRESHOLD=0.01
SATURATION_CONFIRM_LEVELS=3

# Curve-specific knobs (also overridable via env)
CURVE_LEVEL_PAD=30
FORCE_FULL_SWEEP=false
CURVE_FILE_POLL_TIMEOUT=120

# ---------------------------------------------------------------------------
# Windowed / interceptor sampling
# ---------------------------------------------------------------------------
WINDOW_INTERVAL_MS=100
TIMING_BUFFER_SIZE=16384
TIMING_FLUSH_THRESHOLD=80
C0_ACTIVE_THRESHOLD=0.05
MSR_TURBO_REFRESH_EVERY_S=10
# TSC_FREQ_MHZ=

PERF_EVENTS='cycles,ref-cycles,instructions,LLC-loads,LLC-load-misses,branch-instructions,branch-misses,dTLB-loads,dTLB-load-misses,page-faults'

# ---------------------------------------------------------------------------
# Jaeger tracing — disabled
# ---------------------------------------------------------------------------
JAEGER_SAMPLE_RATIO=0
