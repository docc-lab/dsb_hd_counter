#!/bin/bash
# ===========================================================================
# Step 1 Config: Characterize the SEARCH service (vanilla)
#
# Stateless-forwarding service.  ghz drives search.Search/Nearby directly
# via NodePort; downstream (geo, rate) stays live.
#
# Usage (run from noisy-neighbors/): ./stage1-characterization/step1-characterize.sh configs/step1-search.conf
# ===========================================================================

EXPERIMENT_NAME='Step1 Search Characterization (direct gRPC)'

# ---------------------------------------------------------------------------
# Cluster topology — CHANGE THESE to match your environment
# ---------------------------------------------------------------------------
TARGET_NODE='node-3'                 # Node to pin observed service to
# LOADGEN_TARGET_HOST_OVERRIDE='192.168.146.152'  # Uncomment if node IP from
                                                  # k8s metadata isn't reachable
                                                  # from this loadgen host.

# ---------------------------------------------------------------------------
# Service under observation (single)
# ---------------------------------------------------------------------------
OBSERVED_SERVICE='search'

# ---------------------------------------------------------------------------
# ghz load generator
#
# The payload generator pre-randomizes a JSON array of N search.Nearby
# requests (lat/lon/inDate/outDate) once per experiment; ghz cycles through
# them.  Distribution matches mixed-workload_type_1.lua.
# ---------------------------------------------------------------------------
LOADGEN_BIN='/usr/local/bin/ghz'
LOADGEN_PROTO='../services/search/proto/search.proto'
LOADGEN_PROTO_ROOT='../services'
LOADGEN_METHOD='search.Search/Nearby'
LOADGEN_PAYLOAD_GENERATOR='./loadgen/payloads/gen_search_nearby.py'
LOADGEN_PAYLOAD_COUNT=5000
LOADGEN_CONCURRENCY=12
LOADGEN_CONNECTIONS=4

# Open-loop generation (--async): requests dispatch on schedule independent
# of in-flight response completion.  Mandatory for finding the real
# saturation knee (closed-loop hides it via self-throttling).
LOADGEN_ASYNC=true

# NodePort to expose search on.  Pinned to a port in the firewalld-friendly
# range (30000-32767) so connections aren't silently dropped at the host
# firewall on RHEL / OpenShift nodes.  Mnemonic: 31082 -> service port 8082.
LOADGEN_NODEPORT=31082

# ---------------------------------------------------------------------------
# Stage 1 — Saturation sweep
#
# Sweep RPS from START to MAX with fixed STEP.  A level is declared
# saturated when p99 >= P99_THRESHOLD x baseline, errors appear, or
# actual RPS falls short of target.  After the first saturated level,
# the sweep continues for EXTRA_LEVELS more levels (same step) to
# verify saturation and collect post-knee data.  Knee = highest RPS
# across all levels that did not saturate.
# ---------------------------------------------------------------------------
SATURATION_START_RPS=50
SATURATION_STEP_RPS=25
SATURATION_MAX_RPS=600
SATURATION_DURATION=20
SATURATION_WARMUP=5
SATURATION_P99_THRESHOLD=4.0
# Ignore small numbers of transient gRPC transport errors (e.g. 1 closed
# connection per few thousand requests) when deciding the knee.  Only flag
# saturation when the rate crosses this fraction.  Set 0 for strict mode.
SATURATION_ERROR_RATE_THRESHOLD=0.01
# Require this many CONSECUTIVE saturated levels to confirm saturation and
# stop the sweep.  A single-level p99 spike that recovers (GC pause,
# scheduler hiccup, conntrack flush) does not stop the run.
SATURATION_CONFIRM_LEVELS=3

# ---------------------------------------------------------------------------
# Stage 2 — Characterization runs
#
# Established knee for search ≈ 175 RPS → characterize at 90% = 158 RPS.
# 3 minute runs, 4 runs.
# ---------------------------------------------------------------------------
CHARACTERIZE_DURATION=30
CHARACTERIZE_RUNS=3
CHARACTERIZE_KNEE_FRACTION=0.9

# ---------------------------------------------------------------------------
# External perf stat events (Ice Lake-SP optimized set) — see step1-characterize.sh
# ---------------------------------------------------------------------------
PERF_TOPDOWN_GROUP='slots,topdown-retiring,topdown-bad-spec,topdown-fe-bound,topdown-be-bound'
PERF_EVENTS='cycles,instructions,LLC-loads,LLC-load-misses,cycle_activity.stalls_l3_miss,offcore_requests.all_data_rd,L1-dcache-load-misses,L1-icache-load-misses,dTLB-load-misses,branch-misses'

# ---------------------------------------------------------------------------
# Jaeger tracing — disabled to avoid overhead during characterization
# ---------------------------------------------------------------------------
JAEGER_SAMPLE_RATIO=0

# ---------------------------------------------------------------------------
# Stage 2 stressor (max-intensity, per-run lifecycle, unpinned)
#
# When STRESSOR_TYPE != 'none', a stress-ng pod is launched on TARGET_NODE
# for each Stage 2 characterization run.  Stage 1 (saturation sweep) stays
# clean so the knee is found vanilla; conditions are then compared at the
# SAME char_rps via the skip-Stage-1 CLI:
#
#   ./step1-characterize.sh configs/step1-search.conf            # vanilla, finds knee
#   STRESSOR_TYPE=cpu   ./step1-characterize.sh ... <char_rps>    # cpu contention
#   STRESSOR_TYPE=cache ./step1-characterize.sh ... <char_rps>    # cache contention
#
# Mapping:
#   cpu    -> stress-ng-helpers.sh `cpu`        (--cpu N)
#   cache  -> stress-ng-helpers.sh `cache-llc`  (--stream N --stream-l3-size SIZE)
#
# WORKERS=0 -> stress-ng uses all online CPUs (max intensity).
# ---------------------------------------------------------------------------
STRESSOR_TYPE='none'    # none | cpu | cache
# STRESSOR_WORKERS=0    # 0 = all online CPUs (max intensity)
# CACHE_LLC_L3_SIZE=8M  # per-worker working set, only for STRESSOR_TYPE=cache
