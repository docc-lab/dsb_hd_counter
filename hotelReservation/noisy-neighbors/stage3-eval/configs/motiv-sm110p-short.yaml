# Motivation pass 2, scenario "short bursts" (2026-11-01): the extrinsic scenario
# with 3 s bursts every 20 s (20-23, 40-43, 60-63 | 80-83, 100-103, 120-123)
# instead of 10 s. Replica start-up is several seconds, harvesting reacts in
# ~2 s: the cores-to-SLO curve of replication should fall apart here.
experiment:
  name: motiv-sm110p-short
  duration_s: 140
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-4
testbeds:
  hotelReservation:
    loadgen: {rps: 3600, shape: exp}   # victim load, fixed across phases (~75% of the 1-P victim)
  socialNetwork:
    loadgen: {rps: 7000, shape: {burst_s: 3, idle_s: 17, peak_rps: 7000, base_rps: 500}, start_offset_s: 20}
    replicas: 2
  sockshop:
    loadgen: {rps: 8000, shape: {burst_s: 3, idle_s: 17, peak_rps: 8000, base_rps: 600}, start_offset_s: 20}
    replicas: 2
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.3.0
  cpu_set: "18,19,20"   # July's victim threads (siblings 2,3,4); HC Primary; aggressors unpinned over the node
  score_log: true
aggressors:
  - {testbed: socialNetwork, service: compose-post,  role: bad}
  - {testbed: socialNetwork, service: post-storage,  role: bad}
  - {testbed: socialNetwork, service: social-graph,  role: bad}
  - {testbed: socialNetwork, service: user-timeline, role: bad}
  - {testbed: sockshop, service: cart,      role: bad}
  - {testbed: sockshop, service: catalogue, role: bad}
  - {testbed: sockshop, service: order,     role: bad}
