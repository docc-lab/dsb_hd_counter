# c6320 variant (Clemson "icelake-perf1", 2026-11-10, 2x E5-2683 v3, SMT on, 2.0 GHz pinned): victim threads 4,6 (siblings 32,34).
# Motivation pass 3 (2026-11-08, Wisconsin sm110p "icelake-perf", SMT ON, 2.4 GHz):
# extrinsic bursts that cover ~10 % of the time / requests (user), replicas on a
# controlled node-3.
#
# Phases (run with ARM_OFFSET_S=120): p1 0-30 victim only; p2 30-120 contention,
# mitigation disabled; mitigation enabled at 120; p3 120-260. Aggressor bursts
# 6 s on / 54 s off from t = 30: 30-36, 90-96 | 150-156, 210-216 (two per phase,
# 12 s of 120 = 10 %). The first p3 burst comes 30 s after enabling so forced
# replicas (rep*f) are up before it; 6 s is enough for the aggressors to reach
# their plateau (the 2026-11-02 3 s bursts ramped within 1 s).
#
# Victim: 2-P on threads 18,19 (the 3-P July victim cannot be overloaded through the chain,
# so pass 3 uses the same 2-P victim in BOTH scenarios); aggressors as motiv-sm110p.yaml (
# SN/SS aggressors unpinned over node-4's pool 0-13,16-29). Replicas: node-3,
# threads 18-29 (one hyperthread per core 2-13); node-3's load level is set by
# run-motiv3.sh (quiet / medium / contended = a busy-loop pod on the siblings 2-13).

experiment:
  name: motiv3-c6320
  duration_s: 260
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-4
testbeds:
  hotelReservation:
    loadgen: {rps: 2000, shape: exp}   # victim load, fixed across phases (c6320: 0.96 cores at 2000, knee ~6k offered, 10k collapses)
  socialNetwork:
    loadgen: {rps: 5000, shape: {burst_s: 6, idle_s: 54, peak_rps: 5000, base_rps: 350}, start_offset_s: 30}   # c6320: 0.5x gave 5.0 aggressor cores on the 12-core pool and p95 1.30x (smoke); 0.7x targets ~7 cores (the sm110p's 58 % sibling occupancy)
    replicas: 2
  sockshop:
    loadgen: {rps: 5600, shape: {burst_s: 6, idle_s: 54, peak_rps: 5600, base_rps: 400}, start_offset_s: 30}
    replicas: 2
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.3.0
  cpu_set: "4,6"   # 2-P victim (run-motiv3.sh sets GOMAXPROCS=2): threads 18,19, siblings 2,3; HC Primary pool 18,19
  score_log: true
aggressors:
  - {testbed: socialNetwork, service: compose-post,  role: bad}
  - {testbed: socialNetwork, service: post-storage,  role: bad}
  - {testbed: socialNetwork, service: social-graph,  role: bad}
  - {testbed: socialNetwork, service: user-timeline, role: bad}
  - {testbed: sockshop, service: cart,      role: bad}
  - {testbed: sockshop, service: catalogue, role: bad}
  - {testbed: sockshop, service: order,     role: bad}
