# predictor collection point -- baseline, victim 3200 exp, no aggressors
# generated by tools/gen_collect_configs.py; run via run-collect.sh (ARM=none)
experiment:
  name: col-base-3200
  duration_s: 140
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-4
testbeds:
  hotelReservation:
    loadgen: {rps: 3200, shape: exp}
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.3.0
  cpu_set: "4,6"
  score_log: true
aggressors: []
