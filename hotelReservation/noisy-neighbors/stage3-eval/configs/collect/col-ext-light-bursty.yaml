# predictor collection point -- ext light bursty: 15s/25s, peak 3000/3600, base 500/600
# generated by tools/gen_collect_configs.py; run via run-collect.sh (ARM=none)
experiment:
  name: col-ext-light-bursty
  duration_s: 140
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-4
testbeds:
  hotelReservation:
    loadgen: {rps: 3200, shape: exp}
  socialNetwork:
    loadgen: {rps: 3000, shape: {burst_s: 15, idle_s: 25, peak_rps: 3000, base_rps: 500}, start_offset_s: 20}
    replicas: 2
  sockshop:
    loadgen: {rps: 3600, shape: {burst_s: 15, idle_s: 25, peak_rps: 3600, base_rps: 600}, start_offset_s: 20}
    replicas: 2
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.3.0
  cpu_set: "4,6"
  score_log: true
aggressors:
  - {testbed: socialNetwork, service: compose-post, role: bad}
  - {testbed: socialNetwork, service: post-storage, role: bad}
  - {testbed: socialNetwork, service: social-graph, role: bad}
  - {testbed: socialNetwork, service: user-timeline, role: bad}
  - {testbed: sockshop, service: cart, role: bad}
  - {testbed: sockshop, service: catalogue, role: bad}
  - {testbed: sockshop, service: order, role: bad}
