# predictor collection point -- ext SS only: SS 5000 exp @20s, socialNetwork absent
# generated by tools/gen_collect_configs.py; run via run-collect.sh (ARM=none)
experiment:
  name: col-ext-ss-only
  duration_s: 140
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-4
testbeds:
  hotelReservation:
    loadgen: {rps: 3200, shape: exp}
  sockshop:
    loadgen: {rps: 5000, shape: exp, start_offset_s: 20}
    replicas: 2
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.3.0
  cpu_set: "4,6"
  score_log: true
aggressors:
  - {testbed: sockshop, service: cart, role: bad}
  - {testbed: sockshop, service: catalogue, role: bad}
  - {testbed: sockshop, service: order, role: bad}
