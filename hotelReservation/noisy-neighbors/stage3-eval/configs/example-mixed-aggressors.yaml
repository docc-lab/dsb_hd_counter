# Stage 3 Aggressor Eval -- Mixed cross-testbed example
#
# Demonstrates the heterogeneous aggressor list: a single experiment
# pulls aggressors from multiple testbeds (HR + socialNetwork + sockshop)
# and runs one independent wrk2 driver per testbed in parallel.
#
# This is the shape any "good vs bad with realistic mix of co-tenants"
# experiment will take. The bad-vs-good role labels are pure metadata
# for the mitigation-side eval-report fetcher to slice on.
#
# Pre-requisite: the sockshop testbed integration must be implemented
# first (see ../TODO_SOCKSHOP.md) for the sockshop entries to work.
# Until then, comment out the sockshop aggressor below and the
# orchestrator runs cleanly with HR + SN only.
#
# To run (after editing target_node + image tag):
#   ./stage3-eval.sh configs/example-mixed-aggressors.yaml
#
# Output lands in data/<experiment_id>/. See ../configs/schema.md for
# the full schema and ../README.md for the mitigation-side contract.

experiment:
  name: mixed-aggressors-cross-testbed
  duration_s: 120
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-3
testbeds:
  hotelReservation:
    loadgen: {rps: 2400, shape: exp}    # victim load -- keep fixed across runs
  socialNetwork:
    loadgen: {rps: 5400, shape: exp}   # drive the SN aggressors hard; ramp w/ mpstat
    replicas: 2                        # scale SN compute services (datastores untouched)
  sockshop:
    loadgen: {rps: 6300, shape: exp}   # drive the SS aggressors hard; ramp w/ mpstat
    replicas: 2                        # scale SS app services (db pods untouched)
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.1.1
  score_log: true   # GORDION_SCORE_LOG=true -> score_event lines in victim pod log
aggressors:
  # ~9 co-tenants, all pinned to target_node with the victim. The SN/SS
  # services are the real contention generators (independent wrk2 load);
  # the HR ones ride HR's own 325 rps. Roles are metadata only (placement
  # and the unlimited+high-priority boost are identical regardless of role).
  #
  # HR co-tenants (driven by HR's own load).
  - {testbed: hotelReservation, service: profile, role: bad}
  - {testbed: hotelReservation, service: geo,     role: good}
  # SN co-tenants (driven by the SN wrk2 at the rps above).
  - {testbed: socialNetwork, service: compose-post,  role: bad}
  - {testbed: socialNetwork, service: post-storage,  role: bad}
  - {testbed: socialNetwork, service: social-graph,  role: bad}
  - {testbed: socialNetwork, service: user-timeline, role: bad}
  # SS co-tenants (driven by the SS wrk2 at the rps above).
  - {testbed: sockshop, service: cart,      role: bad}
  - {testbed: sockshop, service: catalogue, role: bad}
  - {testbed: sockshop, service: order,     role: bad}
