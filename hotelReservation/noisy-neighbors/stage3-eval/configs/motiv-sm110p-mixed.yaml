# Motivation pass 2, scenario "mixed" (2026-11-01): the extrinsic bursty
# aggressors AND an intrinsic load step on the victim (base 800 + extra from
# t=20 s). Neither single mitigation reaches the SLO alone; arms: none, hc-bang
# (reactive), rep3f (forced), hcrep3 (harvesting + 3 replicas). EXTRA_RPS as in
# the int config.
experiment:
  name: motiv-sm110p-mixed
  duration_s: 140
  warmup_s: 30
  cooldown_s: 30
  runs: 1
  target_node: node-4
testbeds:
  hotelReservation:
    loadgen:
      rps: 800
      shape: exp
      extra: {rps: 10200, shape: exp, start_offset_s: 20}   # 11000 offered ~ 1.3x the 1-P victim (probe 2026-11-01: the 3-P victim used only 2.3 cores at 20k, chain max ~19.4k)
  socialNetwork:
    loadgen: {rps: 7000, shape: {burst_s: 10, idle_s: 10, peak_rps: 7000, base_rps: 500}, start_offset_s: 20}
    replicas: 2
  sockshop:
    loadgen: {rps: 8000, shape: {burst_s: 10, idle_s: 10, peak_rps: 8000, base_rps: 600}, start_offset_s: 20}
    replicas: 2
victim:
  testbed: hotelReservation
  service: search
  image: docclabgroup/search-online:v2.3.0
  cpu_set: "18"   # ONE thread, run with STAGE3_VICTIM_GOMAXPROCS=1: a 3-P victim cannot be overloaded through the chain (sibling 2)
  score_log: true
aggressors:
  - {testbed: socialNetwork, service: compose-post,  role: bad}
  - {testbed: socialNetwork, service: post-storage,  role: bad}
  - {testbed: socialNetwork, service: social-graph,  role: bad}
  - {testbed: socialNetwork, service: user-timeline, role: bad}
  - {testbed: sockshop, service: cart,      role: bad}
  - {testbed: sockshop, service: catalogue, role: bad}
  - {testbed: sockshop, service: order,     role: bad}
