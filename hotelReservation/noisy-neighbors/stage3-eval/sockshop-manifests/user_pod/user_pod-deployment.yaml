
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-pod
  labels:
    blueprint.service: user-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      blueprint.service: user-pod
  template:
    metadata:
      name: user-pod
      labels:
        blueprint.service: user-pod
    spec:
      containers:
      
        - name: user-ctr
          image: docclabgroup/sockshop_user_ctr
          imagePullPolicy: Always
          env:
            - name: USER_SERVICE_GRPC_BIND_ADDR
              value: "0.0.0.0:12345"
          ports:
            - containerPort: 12345
      restartPolicy: Always
      hostname: user-pod
