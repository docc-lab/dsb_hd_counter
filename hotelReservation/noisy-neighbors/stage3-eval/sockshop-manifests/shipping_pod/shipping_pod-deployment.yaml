
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-pod
  labels:
    blueprint.service: shipping-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      blueprint.service: shipping-pod
  template:
    metadata:
      name: shipping-pod
      labels:
        blueprint.service: shipping-pod
    spec:
      containers:
      
        - name: shipping-ctr
          image: docclabgroup/sockshop_shipping_ctr
          imagePullPolicy: Always
          env:
            - name: SHIPPING_SERVICE_GRPC_BIND_ADDR
              value: "0.0.0.0:12345"
            - name: SHIPPING_SERVICE_GRPC_DIAL_ADDR
              value: "localhost:12345"
          ports:
            - containerPort: 12345
      restartPolicy: Always
      hostname: shipping-pod
