apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.22.0 (955b78124)
  creationTimestamp: null
  labels:
    io.kompose.service: profile
  name: profile
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: profile
  strategy: {}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.22.0 (955b78124)
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
        # AppArmor's docker-default profile blocks /dev/cpu/N/msr access
        # even with CAP_SYS_RAWIO; opt this container out so the MSR-based
        # freq sampler in services/perf/msr_reader.c can pread the device.
        # The container name (right of the slash) MUST match the
        # spec.containers[].name below.
        container.apparmor.security.beta.kubernetes.io/hotel-reserv-profile: unconfined
      creationTimestamp: null
      labels:
        io.kompose.service: profile
    spec:
      containers:
        - command:
            - profile
          # Use the online image (gordion-online-profile:vN) when running
          # with ENABLE_WINDOWED_SAMPLING=true + a model baked in. The
          # online image extends the base via Dockerfile.online and
          # ships /etc/gordion/{model.onnx,shortlist.json} +
          # /usr/lib/libonnxruntime.so plus default GORDION_* env vars.
          image: deathstarbench/hotel-reservation:latest
          name: hotel-reserv-profile
          ports:
            - {name: rpc,     containerPort: 8081}
            - {name: score,   containerPort: 7900}   # Stage 3 ContentionStream
            - {name: instrum, containerPort: 7901}   # Stage 3 InstrumentationStream
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "3"
          securityContext:
            # See kubernetes/search/search-deployment.yaml for the rationale;
            # privileged works around CRI runtimes that silently filter
            # SYS_RAWIO. Narrow back to capabilities.add if your cluster
            # operator prefers.
            privileged: true
          # /dev/cpu/<N>/msr device files for the MSR-based freq sampler
          # (services/perf/msr_reader.c). Requires `modprobe msr` on the
          # host node (Daemonset or one-time setup); without these mounts
          # the freq fields land with ok=false and the rest zeroed.
          volumeMounts:
            - {name: cpu-devices, mountPath: /dev/cpu, readOnly: true}
          # Stage 3 env vars. Comment out or set GORDION_SCORE_SOURCE=none
          # to disable Stage 3 entirely while keeping the Stage 2
          # disk-dump path intact.
          env:
            - {name: ENABLE_WINDOWED_SAMPLING, value: "true"}
            - {name: GORDION_SCORE_SOURCE,    value: "onnx"}
            # The remaining GORDION_* env vars (paths, ports, buffers)
            # default sensibly via Dockerfile.online ENV; uncomment below
            # to override per-pod.
            # - {name: GORDION_MODEL,        value: "/etc/gordion/model.onnx"}
            # - {name: GORDION_SHORTLIST,    value: "/etc/gordion/shortlist.json"}
            # - {name: GORDION_SCORE_PORT,   value: "7900"}
            # - {name: GORDION_INSTRUMENTATION_PORT, value: "7901"}
      volumes:
        - name: cpu-devices
          hostPath:
            path: /dev/cpu
            type: Directory
      restartPolicy: Always
status: {}
