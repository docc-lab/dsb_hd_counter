apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.22.0 (955b78124)
  creationTimestamp: null
  labels:
    io.kompose.service: memcached-profile
  name: memcached-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: memcached-profile
  strategy: {}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.22.0 (955b78124)
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
      creationTimestamp: null
      labels:
        io.kompose.service: memcached-profile
    spec:
      # Co-locate with the profile service to keep its cache lookups node-local:
      # some request types issue ~1000 memcached ops/request, so a cross-node
      # cache turns tens of us into tens of ms. Strong preference (not
      # required) so it never blocks scheduling. (Ported from stage3 04299e9.)
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    io.kompose.service: profile
                topologyKey: kubernetes.io/hostname
      containers:
        - env:
            - name: MEMCACHED_CACHE_SIZE
              value: "128"
            - name: MEMCACHED_THREADS
              value: "2"
          image: memcached
          name: hotel-reserv-profile-mmc
          ports:
            - containerPort: 11211
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "3"
      restartPolicy: Always
status: {}
