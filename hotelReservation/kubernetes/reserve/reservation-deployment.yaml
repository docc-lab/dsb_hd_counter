apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.22.0 (955b78124)
  creationTimestamp: null
  labels:
    io.kompose.service: reservation
  name: reservation
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: reservation
  strategy: {}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.22.0 (955b78124)
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
      creationTimestamp: null
      labels:
        io.kompose.service: reservation
    spec:
      containers:
        - command:
            - reservation
          image: docclabgroup/hotelreservation:panic-fixed-1.4
          name: hotel-reserv-reservation
          env:
            # Match GOMAXPROCS to the cpu limit (3). Without this the Go
            # runtime defaults to the node core count (~32) and fans threads
            # past the 3-core CFS quota -> heavy throttling + latency jitter
            # (stage-3 measured: nr_throttled climbing constantly). Adjust if
            # the cpu limit changes. (Ported from stage3-predictor.)
            - name: GOMAXPROCS
              value: "3"
          ports:
            - containerPort: 8087
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "3"
          securityContext:
            capabilities:
              add:
              - SYS_ADMIN
      restartPolicy: Always
status: {}
