apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.22.0 (955b78124)
  creationTimestamp: null
  labels:
    io.kompose.service: jaeger
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jaeger
  strategy: {}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.22.0 (955b78124)
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
      creationTimestamp: null
      labels:
        io.kompose.service: jaeger
    spec:
      containers:
        - image: jaegertracing/all-in-one:latest
          name: hotel-reserv-jaeger
          # all-in-one stores traces IN MEMORY and grows without bound.
          # Uncapped it filled node-1 over hours of experiment traffic,
          # driving the node into direct-reclaim stalls (20-40 s freezes
          # of everything co-located: etcd, kube-scheduler, frontend,
          # geo, mongodb-rate) until the kernel OOM-killer reaped it
          # (observed 2026-07-10 15:03, exit 137). max-traces bounds the
          # store; the memory limit below contains any future blowup to
          # a cgroup-local OOM instead of a node-wide reclaim storm.
          args: ["--memory.max-traces=50000"]
          ports:
            - containerPort: 14269
            - containerPort: 5778
            - containerPort: 14268
            - containerPort: 14267
            - containerPort: 16686
            - containerPort: 5775
              protocol: UDP
            - containerPort: 6831
              protocol: UDP
            - containerPort: 6832
              protocol: UDP
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 2Gi
      restartPolicy: Always
status: {}
